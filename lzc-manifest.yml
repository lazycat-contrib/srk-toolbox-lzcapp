---
application:
  subdomain: srk-toolbox
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://srk-toolbox:80/

services:
  srk-toolbox:
    image: registry.lazycat.cloud/czyt/czyt/srk-toolbox:b7727e0e6e3625a1
    ports:
      - "8080:80"
    cpu_shares: 512
    mem_limit: 512M
